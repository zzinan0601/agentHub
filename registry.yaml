# 호출 가능한 에이전트 목록. 이 파일이 유일한 목록이다. (요구사항 17)
#
# 코어가 30초마다 다시 읽으므로 줄을 추가해도 코어를 재기동할 필요가 없다.
# url 은 그 에이전트가 도는 노트북의 주소다. 개발 중에는 localhost, 다른 사람이
# 불러야 하면 내 노트북 IP 를 적는다.
#
# 포트는 나눠 갖지 않는다. 에이전트마다 노트북이 다르므로 IP 가 이미 서로를 구분한다.
# 전원이 9010 을 쓴다 (9001/9002 는 예제 에이전트가 쓴다). 방화벽도 한 포트만 열면 된다.
# 한 노트북에서 두 개를 띄울 때만 .env 의 AGENT_PORT 를 바꾼다.

agents:
  # --- 예제 (계약이 도는지 확인하는 용도. 지우지 않는다) ---
  - id: echo
    url: http://localhost:9001
  - id: summary
    url: http://localhost:9002

  # --- 여기부터 각자 한 줄씩 추가한다 ---
  # - id: sales-report
  #   url: http://192.168.0.31:9010
