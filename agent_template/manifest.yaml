# 이 에이전트의 자기소개. 코어의 라우터 LLM 이 description 과 examples 를 읽고
# "이 질문을 이 에이전트에게 보낼지" 를 판단하므로, 설명을 구체적으로 쓸수록 라우팅이 정확해진다.

id: my-agent # registry.yaml 의 id 와 반드시 일치해야 한다 (영문 소문자/하이픈)
name: 내 업무 에이전트 # 화면에 보일 이름
owner: 홍길동 # 담당 개발자

# 무엇을 할 수 있는지 한 문단으로. "매출 데이터를 조회한다" 같은 모호한 표현보다
# "어떤 데이터를, 어떤 기간/단위로, 어떤 형태로 준다" 를 쓴다.
description: |
  (여기에 이 에이전트가 무엇을 할 수 있는지 구체적으로 쓴다.)
  예: 영업 오라클 DB 의 일별 매출 테이블을 조회해 기간별/지점별 매출 합계와
  전월 대비 증감을 Markdown 표로 정리한다. 최대 조회 기간은 12개월이다.

tags:
  - 매출
  - 오라클

# 이 에이전트를 부를 만한 질문들. 라우터 LLM 의 판단 근거가 된다.
examples:
  - 지난달 지점별 매출 알려줘
  - 3월 매출 상위 10개 지점은?
